<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#062c66" />
    <meta
      name="description"
      content="MENTOR AI aide les jeunes a passer de l'incertitude a une premiere action claire."
    />
    <title>MENTOR AI</title>
    <style>
:root {
  color-scheme: light;
  --blue-950: #041b3f;
  --blue-900: #062c66;
  --blue-800: #0a3d86;
  --blue-100: #d9e9ff;
  --coral-600: #df3d4d;
  --coral-100: #ffe5e8;
  --green-600: #168351;
  --amber-500: #c77a07;
  --ink: #102033;
  --muted: #5d6b7d;
  --surface: #ffffff;
  --surface-soft: #f7f9fc;
  --line: #dce4ef;
  --shadow: 0 16px 42px rgba(9, 43, 92, 0.14);
  --radius: 8px;
  --tap: 48px;
}

[data-theme="dark"] {
  color-scheme: dark;
  --ink: #eef5ff;
  --muted: #a9b8cc;
  --surface: #081a36;
  --surface-soft: #06142b;
  --line: #254267;
  --blue-100: #183a68;
  --coral-100: #4b1d29;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--surface-soft);
  color: var(--ink);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  line-height: 1.5;
}

button,
input,
select {
  font: inherit;
}

button,
select,
a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
}

.skip-link {
  position: fixed;
  left: 1rem;
  top: -6rem;
  z-index: 20;
  min-height: var(--tap);
  padding: 0.85rem 1rem;
  background: var(--surface);
  border: 2px solid var(--coral-600);
  border-radius: var(--radius);
}

.skip-link:focus {
  top: 1rem;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(1120px, calc(100% - 2rem));
  min-height: 4.25rem;
  margin: 0 auto;
  gap: 1rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  gap: 0.65rem;
  color: var(--blue-900);
  font-weight: 850;
  text-decoration: none;
  letter-spacing: 0;
}

[data-theme="dark"] .brand {
  color: #7fb2ff;
}

.brand-mark {
  display: grid;
  width: 2.25rem;
  height: 2.25rem;
  place-items: center;
  background: var(--blue-900);
  color: #fff;
  border-radius: 7px;
  box-shadow: 0 8px 20px rgba(6, 44, 102, 0.22);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.select-wrap select,
.icon-button {
  min-height: var(--tap);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--radius);
}

.select-wrap select {
  min-width: 6.5rem;
  padding: 0 0.7rem;
  font-weight: 750;
}

.icon-button {
  display: grid;
  width: var(--tap);
  place-items: center;
  cursor: pointer;
}

.theme-icon {
  width: 1.25rem;
  height: 1.25rem;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--blue-900) 0 50%, #f7c948 50%);
  border: 2px solid currentColor;
}

main {
  overflow: hidden;
}

.section {
  padding: 4rem 0;
}

.section-inner,
.hero-inner {
  width: min(1120px, calc(100% - 2rem));
  margin: 0 auto;
}

.hero {
  position: relative;
  min-height: calc(100svh - 4.25rem);
  display: grid;
  align-items: center;
  padding: 2.25rem 0 3rem;
  background:
    linear-gradient(140deg, rgba(6, 44, 102, 0.08), transparent 40%),
    linear-gradient(0deg, var(--surface-soft), var(--surface));
}

.hero-inner {
  display: grid;
  gap: 2rem;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  min-height: 2rem;
  padding: 0.25rem 0.65rem;
  background: var(--coral-100);
  color: var(--coral-600);
  border-radius: 999px;
  font-weight: 850;
  font-size: 0.86rem;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  max-width: 11ch;
  margin-bottom: 1rem;
  color: var(--blue-950);
  font-size: clamp(2.8rem, 12vw, 6.4rem);
  line-height: 0.92;
  letter-spacing: 0;
}

[data-theme="dark"] h1,
[data-theme="dark"] h2 {
  color: #f5f9ff;
}

.hero-subtitle {
  max-width: 35rem;
  margin-bottom: 1.15rem;
  color: var(--muted);
  font-size: 1.1rem;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap);
  padding: 0 1.05rem;
  border: 1px solid transparent;
  border-radius: var(--radius);
  font-weight: 850;
  text-decoration: none;
  cursor: pointer;
}

.button-primary {
  background: var(--coral-600);
  color: #fff;
  box-shadow: 0 12px 26px rgba(223, 61, 77, 0.24);
}

.button-secondary {
  background: var(--surface);
  border-color: var(--line);
  color: var(--blue-900);
}

[data-theme="dark"] .button-secondary {
  color: #b8d5ff;
}

.trust-row {
  display: grid;
  gap: 0.65rem;
  margin-top: 1rem;
  color: var(--muted);
  font-size: 0.96rem;
}

.trust-item {
  display: flex;
  gap: 0.55rem;
  align-items: center;
}

.trust-dot {
  width: 0.6rem;
  height: 0.6rem;
  flex: 0 0 auto;
  background: var(--green-600);
  border-radius: 999px;
}

.phone-shell {
  width: min(100%, 23rem);
  margin: 0 auto;
  padding: 0.75rem;
  background: var(--blue-950);
  border-radius: 2rem;
  box-shadow: var(--shadow);
}

.phone-screen {
  overflow: hidden;
  min-height: 26rem;
  background: var(--surface);
  color: var(--ink);
  border-radius: 1.35rem;
}

.phone-top {
  display: flex;
  justify-content: space-between;
  padding: 1rem;
  background: var(--blue-900);
  color: #fff;
  font-size: 0.82rem;
  font-weight: 800;
}

.mission-preview {
  padding: 1rem;
}

.mission-preview h2 {
  margin-bottom: 0.45rem;
  font-size: 1.35rem;
}

.mission-card {
  margin-top: 1rem;
  padding: 1rem;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.mission-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.8rem;
}

.pill {
  display: inline-flex;
  align-items: center;
  min-height: 1.85rem;
  padding: 0 0.55rem;
  background: var(--blue-100);
  color: var(--blue-900);
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 850;
}

[data-theme="dark"] .pill {
  color: #d7e8ff;
}

.mission-progress {
  height: 0.7rem;
  overflow: hidden;
  background: var(--line);
  border-radius: 999px;
}

.mission-progress span {
  display: block;
  width: 42%;
  height: 100%;
  background: var(--green-600);
  border-radius: inherit;
}

.mini-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-top: 1rem;
}

.mini-stat {
  padding: 0.65rem 0.5rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  text-align: center;
}

.mini-stat strong {
  display: block;
  color: var(--blue-900);
  font-size: 1.05rem;
}

[data-theme="dark"] .mini-stat strong {
  color: #8fbdff;
}

.mini-stat span {
  color: var(--muted);
  font-size: 0.75rem;
}

.check-button {
  width: 100%;
  margin-top: 1rem;
}

.points-toast {
  min-height: 1.5rem;
  margin-top: 0.85rem;
  color: var(--green-600);
  font-weight: 850;
  opacity: 0;
}

.points-toast.is-visible {
  animation: points 900ms ease both;
}

.section-heading {
  max-width: 42rem;
  margin-bottom: 1.6rem;
}

.section-heading h2 {
  margin-bottom: 0.55rem;
  color: var(--blue-950);
  font-size: clamp(1.8rem, 8vw, 3rem);
  line-height: 1;
}

.section-heading p {
  color: var(--muted);
  font-size: 1.04rem;
}

.split-visual {
  display: grid;
  gap: 0.85rem;
}

.before-after {
  display: grid;
  gap: 0.85rem;
}

.state-panel {
  padding: 1.1rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.state-panel strong {
  display: block;
  margin-bottom: 0.45rem;
  color: var(--blue-900);
}

[data-theme="dark"] .state-panel strong {
  color: #8fbdff;
}

.steps {
  display: grid;
  gap: 0.8rem;
  counter-reset: step;
}

.step {
  position: relative;
  min-height: 8rem;
  padding: 1rem 1rem 1rem 4rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.step::before {
  counter-increment: step;
  content: counter(step);
  position: absolute;
  left: 1rem;
  top: 1rem;
  display: grid;
  width: 2.2rem;
  height: 2.2rem;
  place-items: center;
  background: var(--blue-900);
  color: #fff;
  border-radius: 999px;
  font-weight: 900;
}

.grid {
  display: grid;
  gap: 0.8rem;
}

.card {
  padding: 1rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.domain-card {
  display: flex;
  align-items: center;
  min-height: 5.75rem;
  gap: 0.8rem;
}

.domain-icon,
.feature-icon {
  display: grid;
  width: 2.35rem;
  height: 2.35rem;
  flex: 0 0 auto;
  place-items: center;
  background: var(--blue-100);
  color: var(--blue-900);
  border-radius: var(--radius);
  font-weight: 900;
}

[data-theme="dark"] .domain-icon,
[data-theme="dark"] .feature-icon {
  color: #d7e8ff;
}

.feature-card {
  min-height: 10rem;
}

.feature-card h3,
.mentor-card h3,
.privacy-card h3 {
  margin-bottom: 0.45rem;
  font-size: 1.08rem;
}

.feature-card p,
.mentor-card p,
.privacy-card p,
.step p,
.state-panel p,
.coming-card p {
  margin-bottom: 0;
  color: var(--muted);
}

.mentor-card {
  display: grid;
  min-height: 11rem;
}

.mentor-quote {
  align-self: end;
  margin-top: 0.9rem;
  padding-left: 0.75rem;
  border-left: 3px solid var(--coral-600);
  color: var(--muted);
}

.haiti-band {
  background: var(--blue-900);
  color: #fff;
}

.haiti-band .section-heading h2,
.haiti-band .section-heading p {
  color: #fff;
}

.reality-list {
  display: grid;
  gap: 0.8rem;
}

.reality-item {
  padding: 1rem;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: var(--radius);
}

.privacy-grid {
  display: grid;
  gap: 0.8rem;
}

.privacy-card {
  min-height: 8.5rem;
}

.cta-section {
  padding: 4rem 0;
  background: var(--surface);
}

.cta-panel {
  display: grid;
  gap: 1.1rem;
  padding: 1.35rem;
  background: var(--blue-950);
  color: #fff;
  border-radius: var(--radius);
}

.cta-panel h2 {
  margin-bottom: 0.4rem;
  font-size: clamp(1.85rem, 8vw, 3.2rem);
  line-height: 1;
}

.cta-panel p {
  margin-bottom: 0;
  color: #dce9fb;
}

.site-footer {
  padding: 2rem 0;
  background: var(--blue-950);
  color: #dce9fb;
}

.footer-inner {
  display: grid;
  width: min(1120px, calc(100% - 2rem));
  margin: 0 auto;
  gap: 1rem;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1rem;
}

.footer-links a {
  min-height: 2rem;
  color: inherit;
}

.offline-note {
  display: none;
  padding: 0.75rem 1rem;
  background: var(--amber-500);
  color: #1e1300;
  font-weight: 800;
}

.offline-note.is-visible {
  display: block;
}

@keyframes points {
  0% {
    opacity: 0;
    transform: translateY(0.4rem);
  }
  25%,
  80% {
    opacity: 1;
    transform: translateY(0);
  }
  100% {
    opacity: 0;
    transform: translateY(-0.35rem);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

@media (min-width: 680px) {
  .hero-inner {
    grid-template-columns: minmax(0, 1fr) minmax(19rem, 24rem);
    align-items: center;
  }

  .phone-screen {
    min-height: 31rem;
  }

  .trust-row {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .split-visual,
  .before-after,
  .privacy-grid,
  .reality-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .steps,
  .grid-3 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .domain-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .cta-panel {
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 2rem;
  }

  .footer-inner {
    grid-template-columns: 1fr auto;
    align-items: center;
  }
}

@media (min-width: 980px) {
  .section {
    padding: 5.5rem 0;
  }

  .hero {
    padding: 3rem 0 4rem;
  }

  .grid-3,
  .steps {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .feature-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .mentor-grid {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}


/* ===== MENTOR AI : application (démo MVP) ===== */
:root {
  --app-accent: var(--blue-900);
}

[data-theme="dark"] {
  --app-accent: #9cc8ff;
}

:focus-visible {
  outline: 3px solid var(--coral-600);
  outline-offset: 2px;
}

.app-wrap {
  width: min(640px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 1.25rem 0 7rem;
}

.app-wrap.no-nav {
  padding-bottom: 3rem;
}

.app-wrap .app-title {
  max-width: none;
  margin: 0 0 0.4rem;
  color: var(--ink);
  font-size: clamp(1.55rem, 6vw, 2.1rem);
  line-height: 1.15;
  outline: none;
}

.app-wrap h2,
.app-wrap h3 {
  color: var(--ink);
}

.app-sub {
  margin: 0 0 1.1rem;
  color: var(--muted);
}

.app-stack {
  display: grid;
  gap: 0.8rem;
}

.app-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
}

.app-row.between {
  justify-content: space-between;
}

.app-hello {
  margin: 0 0 0.3rem;
  color: var(--muted);
  font-weight: 750;
}

.button-block {
  width: 100%;
}

.button-small {
  min-height: 44px;
  padding: 0 0.8rem;
  font-size: 0.92rem;
}

.button-ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--ink);
}

.button-danger {
  background: var(--coral-600);
  color: #fff;
}

.button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  box-shadow: none;
}

.field {
  display: grid;
  gap: 0.35rem;
  min-width: 0;
}

.field > label,
.field-label,
fieldset.share legend {
  font-weight: 800;
}

.field input[type="text"],
.field input[type="number"],
.field input[type="time"],
.field select,
.field textarea,
.chat-input {
  width: 100%;
  min-height: var(--tap);
  padding: 0.6rem 0.8rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
}

.field textarea {
  min-height: 5rem;
  resize: vertical;
}

fieldset.share {
  display: grid;
  gap: 0.5rem;
  margin: 0;
  padding: 0;
  border: 0;
}

fieldset.share legend {
  margin-bottom: 0.4rem;
  padding: 0;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  min-height: var(--tap);
  padding: 0.35rem 0.8rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  cursor: pointer;
}

.check-row input {
  flex: 0 0 auto;
  width: 1.35rem;
  height: 1.35rem;
  accent-color: var(--coral-600);
}

.trust-note {
  margin: 0;
  padding: 0.8rem 1rem;
  border-radius: var(--radius);
  background: var(--blue-100);
  color: var(--ink);
  font-weight: 650;
}

.field-error {
  min-height: 1.3rem;
  margin: 0;
  color: var(--coral-600);
  font-weight: 750;
}

.bar {
  height: 0.6rem;
  overflow: hidden;
  border-radius: 99px;
  background: var(--line);
}

.bar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--coral-600);
  transition: width 0.3s ease;
}

.quiz-meta {
  display: grid;
  gap: 0.4rem;
  margin-bottom: 1.1rem;
  color: var(--muted);
  font-weight: 750;
  font-size: 0.92rem;
}

.opt-list {
  display: grid;
  gap: 0.6rem;
}

.opt {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  width: 100%;
  min-height: var(--tap);
  padding: 0.7rem 0.9rem;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}

.opt[aria-pressed="true"] {
  border-color: var(--app-accent);
  background: var(--blue-100);
}

.opt-mark {
  flex: 0 0 auto;
  width: 1.25rem;
  height: 1.25rem;
  border: 2px solid var(--muted);
  border-radius: 50%;
}

.opt.multi .opt-mark {
  border-radius: 5px;
}

.opt[aria-pressed="true"] .opt-mark {
  border-color: var(--app-accent);
  background: var(--app-accent);
  box-shadow: inset 0 0 0 3px var(--blue-100);
}

.opt.plain .opt-mark {
  display: none;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.7rem;
}

.cat-card {
  display: grid;
  min-height: 7rem;
  place-items: center;
  align-content: center;
  gap: 0.35rem;
  padding: 0.8rem;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  font-weight: 800;
  text-align: center;
  cursor: pointer;
}

.cat-icon {
  font-size: 1.9rem;
  line-height: 1;
}

.unsure-card {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  width: 100%;
  margin-top: 0.8rem;
  padding: 0.9rem 1rem;
  border: 2px dashed var(--coral-600);
  border-radius: var(--radius);
  background: var(--coral-100);
  color: var(--ink);
  font-weight: 800;
  text-align: left;
  cursor: pointer;
}

.unsure-card small {
  display: block;
  color: var(--muted);
  font-weight: 650;
}

.chat {
  display: grid;
  gap: 0.6rem;
  margin: 0.4rem 0 1rem;
}

.bubble {
  max-width: 90%;
  margin: 0;
  padding: 0.7rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);

const memoryStore = {};

  get(key) {
    try {
      return localStorage.getItem(key);
    } catch (error) {
      return memoryStore[key] ?? null;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (error) {
      memoryStore[key] = value;
    }
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (error) {
      delete memoryStore[key];
    }
  },
};

function translateStatic() {
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    node.textContent = t(node.dataset.i18n);
  });
  $("#languageSelect").innerHTML = `
    <option value="fr">${t("controls.fr")}</option>
    <option value="ht">${t("controls.ht")}</option>
  `;
  $("#languageSelect").value = state.lang;
  $("#themeToggle").setAttribute("aria-label", t("controls.theme"));
  $("#languageSelect").setAttribute("aria-label", t("controls.languageLabel"));
}

function bindDynamicControls() {
  const button = $("#missionDone");
  const toast = $("#pointsToast");
  button?.addEventListener("click", () => {
    state.completed = true;
    store.set("mentor-ai-preview-completed", "true");
    button.textContent = t("missionPreview.done");
    toast.classList.remove("is-visible");
    requestAnimationFrame(() => toast.classList.add("is-visible"));
  });
}

function setTheme(theme) {
  state.theme = theme;
  document.documentElement.dataset.theme = theme;
  store.set("mentor-ai-theme", theme);
  $("#themeToggle").setAttribute("aria-pressed", String(theme === "dark"));
}

async function setLanguage(lang) {
  state.lang = lang;
  store.set("mentor-ai-lang", lang);
  $("#languageSelect").value = lang;
  await loadTranslations(lang);
  translateStatic();
  if (typeof syncLang === "function") syncLang(lang);
  renderCurrent();
}

function handleConnectivity() {
  const note = $("#offlineNote");
  note?.classList.toggle("is-visible", !navigator.onLine);
}

async function init() {
  setTheme(state.theme);
  $("#languageSelect").value = state.lang;
  $("#languageSelect").addEventListener("change", (event) => setLanguage(event.target.value));
  $("#themeToggle").addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));

  await loadTranslations(state.lang);
  translateStatic();
  renderCurrent();
  handleConnectivity();
  window.addEventListener("online", handleConnectivity);
  window.addEventListener("offline", handleConnectivity);

  window.MentorAIModelSchema = MODEL_SCHEMA;
  window.MentorAIAppVersion = APP_VERSION;
}

document.addEventListener("DOMContentLoaded", init);

const P = (fr, ht) => ({ fr, ht });

function resolveLang(node, lang) {
  if (Array.isArray(node)) return node;
  if (node && typeof node === "object") {
    const keys = Object.keys(node);
    if (keys.length === 2 && "fr" in node && "ht" in node) return node[lang];
    const out = {};
    keys.forEach((key) => (out[key] = resolveLang(node[key], lang)));
    return out;
  }
  return node;
}

const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

const KEYWORDS = {
  study: /etud|ecole|lekol|examen|egzamen|universit|inivesite|reviser|revize/,
  work: /travail|emploi|\bjob\b|travay|chomage|\bcv\b|entretien|entevyou/,

  life: /sommeil|dormir|sport|espo|habitude|abitid|domi|organis|oganiz|\btemps\b|\btan\b/,
};

const MentorEngine = {
  categories: ["study", "work", "business", "money", "growth", "life"],

  subGoals(cat) {
    return SUBGOALS[cat] || [];
  },

  detectCategory(text) {
    const value = norm(text);
    return Object.keys(KEYWORDS).find((cat) => KEYWORDS[cat].test(value)) || null;
  },

  /* Parcours « Je ne sais pas par où commencer » : renvoie la prochaine question ou null. */
  async getNextQuestion(answers) {
    if (!answers.domain) return { id: "domain", values: this.categories };
    if (!answers.stage) return { id: "stage", values: ["none", "stopped", "nomethod"] };
    if (!answers.help) return { id: "help", values: ["plan", "easy", "reminder", "options"] };
    if (!answers.goal) return { id: "goal", values: this.subGoals(answers.domain).map((item) => item.id) };
    return null;
  },

  /* Plan de 7 jours : { title: {fr,ht}, task: {fr,ht}, duration, points, status } */
  async generatePlan(cat, subId, ctx) {
    const sub = this.subGoals(cat).find((item) => item.id === subId) || this.subGoals(cat)[0];
    const label = sub.label;
    const time = Number(ctx.time) || 20;
    const duration = ctx.help === "easy" ? Math.min(time, 15) : time;
    const first = {
      title: P("Pourquoi cet objectif ?", "Poukisa objektif sa a ?"),
      task: P(
        `Écris en deux phrases pourquoi « ${label.fr} » est important pour toi.`,
        `Ekri nan de fraz poukisa « ${label.ht} » enpòtan pou ou.`,
      ),
    };
    const last = {
      title: P("Fais le bilan", "Fè bilan an"),
      task: P(
        `Regarde ce que tu as fait cette semaine pour « ${label.fr} ». Écris ce qui a marché et la prochaine étape.`,
        `Gade sa ou fè semèn sa a pou « ${label.ht} ». Ekri sa ki te mache ak pwochen etap la.`,
      ),
    };
    return [first, ...PLAN_BODY[cat], last].map((item, index) => ({
      id: `m_${Date.now().toString(36)}_${index}_${Math.random().toString(36).slice(2, 6)}`,
      title: item.title,
      task: item.task,
      duration,
      points: 10,
      status: "todo",
      doneAt: null,
    }));
  },

  /* Version plus simple d'une mission (bouton « trop difficile »). */
  async generateMission(item, easier) {
    return easier ? { duration: 5, simplified: true } : { duration: item.duration, simplified: false };
  },

  getEncouragement(style, kind) {
    const group = ENCOURAGE[kind] || ENCOURAGE.done;
    return group[style] || group.balanced;
  },

  /* Réponse du mentor dans l'onglet Mentor (règles simples, sans vraie IA). */
  async chatReply(text, ctx) {
    const value = norm(text);
    let body;
    if (/decourag|dekouraj|fatig|triste|stress|abattu|bouke|pa gen kouraj/.test(value)) body = CHAT.discouraged;
    else if (/dorm|sommeil|insomn|domi|somey/.test(value)) body = CHAT.sleep;
    else if (/mission|misyon/.test(value)) {
      return this._withOpener(
        ctx.mission ? { fr: CHAT.mission.fr.replace("{title}", ctx.mission.title).replace("{n}", ctx.mission.minutes), ht: CHAT.mission.ht.replace("{title}", ctx.mission.title).replace("{n}", ctx.mission.minutes) } : CHAT.noMission,
        ctx.style,
      );
    } else if (/\bplan\b/.test(value)) body = CHAT.plan;
    else if (/temps|\btan\b|presse|okipe|occup/.test(value)) body = CHAT.time;
    else body = CHAT.fallback;
    return this._withOpener(body, ctx.style);
  },

  _withOpener(body, style) {
    const opener = OPENERS[style] || OPENERS.balanced;
    return { fr: `${opener.fr} ${body.fr}`.trim(), ht: `${opener.ht} ${body.ht}`.trim() };
  },
};

const dayNum = (s) => {
  const [y, m, d] = s.split("-").map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / 86400000);
};
const addDays = (s, n) => {
  const dt = new Date((dayNum(s) + n) * 86400000);
  return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
};

  const target = keys.reduce((node, key) => node?.[key], obj);

    ],
    preferences: { language: state.lang, mentorStyle: "balanced", notifications: false, mic: false, memory: true },
    chat: [],
  };
}

function loadApp() {
  const base = defaults();
  try {
    const raw = JSON.parse(store.get(APP_KEY) || "null");
    if (!raw || raw.v !== 1) return base;
    const merged = Object.assign(base, raw);
    merged.share = { ...defaults().share, ...(raw.share || {}) };
    merged.preferences = { ...defaults().preferences, ...(raw.preferences || {}) };
    merged.form = { ...defaults().form, ...(raw.form || {}) };
    merged.answers = raw.answers || {};
    merged.goals = Array.isArray(raw.goals) ? raw.goals : [];
    merged.reminders = Array.isArray(raw.reminders) && raw.reminders.length ? raw.reminders : defaults().reminders;
    return merged;
  } catch (error) {
    return base;
  }
}

let A = loadApp();
let appOpen = false;
let toastTimer = null;

/* Sauvegarde : on ne garde que ce que l'utilisateur accepte de partager et de conserver. */
function persist() {
  const out = JSON.parse(JSON.stringify(A));
  ["result", "edit", "confirmReset", "_focus", "_focusTitle", "_scrollChat"].forEach((key) => delete out[key]);
  if (!A.preferences.memory) {
    out.answers = {};
    out.chat = [];
    out.guide = null;
    if (out.user) out.user.age = null;
    out.form.age = "";
  } else {
    Object.keys(out.answers).forEach((key) => {
      if (!A.share[GROUP_OF[key]]) delete out.answers[key];
    });
    if (!A.share.age) {
      if (out.user) out.user.age = null;
      out.form.age = "";
    }
  }
  store.set(APP_KEY, JSON.stringify(out));
}

const goalById = (id) => A.goals.find((goal) => goal.id === id);
const activeGoal = () => goalById(A.activeGoalId);
const draftGoal = () => goalById(A.draftGoalId);
const currentItem = (goal) => goal && goal.plan.find((item) => item.status !== "done");
const doneItems = () => A.goals.flatMap((goal) => goal.plan.filter((item) => item.status === "done"));

function goalLabel(goal) {
  const sub = (SUBGOALS[goal.catId] || []).find((item) => item.id === goal.subId);
  return sub ? loc(sub.label) : goal.goal;
}

function planCtx() {
  const time = Number(A.answers.time) || 20;
  return { time, help: A.ctx.help };
}

function calcStreak() {
  const days = new Set(A.activeDays.map(dayNum));
  let cursor = dayNum(todayStr());
  if (!days.has(cursor)) cursor -= 1;
  let count = 0;
  while (days.has(cursor)) {
    count += 1;
    cursor -= 1;
  }
  return count;
}

function optionLabel(key, value) {
  const quiz = QUIZ.find((item) => item.key === key);
  if (!quiz) return String(value);
  const labels = TL(`quiz.${key}.options`);
  const one = (v) => labels[quiz.values.indexOf(v)] ?? v;
  return Array.isArray(value) ? value.map(one).join(", ") : one(value);
}

function memoryItems() {
  if (!A.preferences.memory) return [];
  const items = [];
  if (A.share.age && A.user?.age) items.push({ key: "age", value: `${A.user.age} ${A.user.age > 1 ? T("common.years") : T("common.year")}` });
  QUIZ.forEach((quiz) => {
    const value = A.answers[quiz.key];
    const has = Array.isArray(value) ? value.length : value;
    if (has && A.share[quiz.group]) items.push({ key: quiz.key, value: optionLabel(quiz.key, value) });
  });
  return items;
}

function fmtMinutes(total) {
  const h = Math.floor(total / 60);
  const m = total % 60;
  return h ? T("progress.hm", { h, m: pad(m) }) : T("progress.m", { m });
}

function toast(message) {
  const node = $("#appToast");
  if (!node) return;
  node.textContent = message;
  node.classList.add("is-visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove("is-visible"), 2800);
}

/* ---------- Navigation et rendu ---------- */
function go(screen) {
  A.screen = screen;
  A._focusTitle = true;
  persist();
  renderApp();
  window.scrollTo(0, 0);
}

function rerender() {
  persist();
  renderApp();
}

function navHTML() {
  return `
    <nav class="tabbar" aria-label="${esc(T("nav.label"))}">
      <div class="tabbar-inner">
        ${TABS.map(
          (id) =>
            `<button type="button" class="tab" data-action="tab" data-value="${id}" ${A.screen === id ? 'aria-current="page"' : ""}>${ICONS[id]}<span>${T("nav." + id)}</span></button>`,
        ).join("")}
      </div>
    </nav>`;
}

function renderApp() {
  const inTabs = TABS.includes(A.screen);
  const view = VIEWS[A.screen] ? VIEWS[A.screen]() : "";
  $("#main").innerHTML = `
    <div class="offline-note" id="offlineNote" role="status">${t("offline")}</div>
    <div class="app-wrap ${inTabs ? "" : "no-nav"}">${view}</div>
    ${inTabs ? navHTML() : ""}`;
  handleConnectivity();
  if (A._focusTitle) {
    $(".app-title")?.focus({ preventScroll: true });
  } else if (A._focus) {
    document.querySelector(`[data-focus="${A._focus}"]`)?.focus({ preventScroll: true });
  }
  A._focus = null;
  A._focusTitle = false;
  if (A._scrollChat) {
    window.scrollTo(0, document.body.scrollHeight);
    A._scrollChat = false;
  }
}

function enterApp() {
  const hasPlan = A.goals.some((goal) => goal.validated);
  if (hasPlan) A.screen = "today";
  else if (!A.user) A.screen = "welcome";
  else if (!ONBOARDING.includes(A.screen) || A.screen === "welcome") A.screen = "quiz";
  if (A.screen === "planReview" && !draftGoal()) A.screen = "goal";
  if (A.screen === "guide" && !A.guide) A.screen = "goal";
  if (A.screen === "sub" && !A.draft.category) A.screen = "goal";
  A.edit = null;
  A.result = null;
  A.confirmReset = false;
  A._focusTitle = false;
}

function wantApp() {
  return location.hash === "#app" || (appOpen && location.hash === "#main");
}

function renderCurrent() {
  const was = appOpen;
  appOpen = wantApp();
  document.body.classList.toggle("in-app", appOpen);
  if (appOpen) {
    if (!was) {
      enterApp();
      window.scrollTo(0, 0);
    }
    renderApp();
  } else {
    renderMain();
  }
  handleConnectivity();
}

      <button type="button" class="button button-primary button-block" data-action="newGoal">${T("today.newGoal")}</button></section>`;
  }

  if (A.restDate === todayStr()) {
    return `${head}
      <section class="mission-big"><h2>${T("today.restTitle")}</h2><p>${T("today.restBody")}</p>
      <button type="button" class="button button-secondary button-block" data-action="extra">${T("today.extra")}</button></section>${tip}`;
  }

  const item = currentItem(goal);
  if (!item) {
    return `${head}
      <section class="mission-big"><p>${T("today.planDone")}</p>
      <div class="app-stack">
        <button type="button" class="button button-primary button-block" data-action="tab" data-value="plan">${T("today.addTask")}</button>
        <button type="button" class="button button-ghost button-block" data-action="newGoal">${T("today.newGoal")}</button>
      </div></section>`;
  }

  const easier = A.easier === item.id;
  const title = loc(item.title);
  const minutes = easier ? 5 : item.duration;
  const n = goal.plan.indexOf(item) + 1;
  return `${head}
    <section class="mission-big">
      <div class="app-row">
        <span class="pill">${T("today.day", { n, total: goal.plan.length })}</span>
        <span class="pill">${minutes} ${T("common.min")}</span>
        <span class="pill">+${item.points || 10} ${T("common.points")}</span>
      </div>
      <h2>${esc(title)}</h2>
      ${easier ? `<p class="easier-note">${T("today.easierTag")}</p>` : ""}
      <p>${easier ? T("today.easierText", { title: esc(title) }) : esc(loc(item.task))}</p>
      <div class="app-stack">
        <button type="button" class="button button-primary button-block" data-action="done">${T("today.done")}</button>
        ${
          easier
            ? `<button type="button" class="button button-ghost button-block" data-action="full">${T("today.full")}</button>`
            : `<button type="button" class="button button-ghost button-block" data-action="hard">${T("today.hard")}</button>`
        }
      </div>
    </section>${tip}`;
}

const VIEWS = {
  welcome: vWelcome,
  quiz: vQuiz,
  goal: vGoal,
  sub: vSub,
  guide: vGuide,
  planReview: vPlan,
  plan: vPlan,
  today: vToday,
  mentor: vMentor,
  progress: vProgress,
  settings: vSettings,
};

/* ---------- Actions ---------- */
async function makeGoal(cat, subId) {
  A.goals = A.goals.filter((goal) => goal.validated);
  const plan = await MentorEngine.generatePlan(cat, subId, planCtx());
  const sub = MentorEngine.subGoals(cat).find((item) => item.id === subId) || MentorEngine.subGoals(cat)[0];
  const goal = {
    id: uid("g"),
    userId: A.user?.id || null,
    catId: cat,
    subId: sub.id,
    category: cat,
    goal: loc(sub.label),
    description: `${T("goal.cats." + cat)} : ${loc(sub.label)}`,
    startDate: null,
    deadline: null,
    status: "active",
    validated: false,
    plan,
  };
  A.goals.push(goal);
  A.draftGoalId = goal.id;
  A.edit = null;
  go("planReview");
}

function completeMission() {
  const goal = activeGoal();
  const item = currentItem(goal);
  if (!item) return;
  const today = todayStr();
  const firstToday = !A.activeDays.includes(today);
  item.status = "done";
  item.doneAt = new Date().toISOString();
  item.minutesDone = A.easier === item.id ? 5 : item.duration;
  A.easier = null;
  if (firstToday) A.activeDays.push(today);
  const earned = item.points || 10;
  const bonus = firstToday && calcStreak() >= 3 ? 5 : 0;
  A.points += earned + bonus;
  let goalDone = false;
  if (goal.plan.every((entry) => entry.status === "done")) {
    goal.status = "done";
    A.points += 50;
    goalDone = true;
  }
  const newBadges = [];
  const unlock = (id) => {
    if (!A.badges.includes(id)) {
      A.badges.push(id);
      newBadges.push(id);
    }
  };
  if (doneItems().length >= 1) unlock("first");
  if (calcStreak() >= 3) unlock("streak3");
  if (doneItems().length >= 5) unlock("five");
  if (goalDone) unlock("goal");
  const next = currentItem(goal);
  A.result = {
    earned,
    bonus,
    goalDone,
    newBadges,
    message: MentorEngine.getEncouragement(A.preferences.mentorStyle, "done"),
    next: next ? next.title : null,
  };
  A.restDate = null;
  rerender();
}

function memoryDelete(key) {
  if (key === "age") {
    if (A.user) A.user.age = null;
    A.form.age = "";
  } else {
    delete A.answers[key];
  }
}

function resolveGuideNext() {
  return MentorEngine.getNextQuestion(A.guide.answers).then((next) => {
    A.guide.next = next;
    if (!next) {
      return MentorEngine.generatePlan(A.guide.answers.domain, A.guide.answers.goal, planCtx()).then((plan) => {
        A.guide.preview = plan[0];
      });
    }
    return null;
  });
}

function afterGuide() {
  const next = A.guide.next;
  A._focus = next ? `g-${next.values[0]}` : null;
  A._focusTitle = !next;
  rerender();
}

async function startGuide(domain) {
  A.guide = { answers: domain ? { domain } : {}, log: [], next: null, preview: null, free: "" };
  if (domain) A.draft.category = domain;
  await resolveGuideNext();
  go("guide");
}

const ACTIONS = {
  /* 1. Inscription */
  signup() {
    const name = String(A.form.firstName || "").trim();
    const age = Number(A.form.age);
    const error = $("#formError");
    if (!name) {
      error.textContent = T("welcome.errName");
      $("#fName")?.focus();
      return;
    }
    if (!Number.isInteger(age) || age < 10 || age > 99) {
      error.textContent = T("welcome.errAge");
      $("#fAge")?.focus();
      return;
    }
    A.user = {
      ...(A.user || { id: uid("u"), createdAt: new Date().toISOString() }),
      firstName: name,
      age,
      language: state.lang,
      profile: {},
      preferences: {},
    };
    A.preferences.language = state.lang;
    A.quizStep = 0;
    go("quiz");
  },

  /* 2. Questionnaire */
  pick(el) {
    const quiz = QUIZ.find((item) => item.key === el.dataset.key);
    const value = el.dataset.value;
    if (quiz.multi) {
      const list = Array.isArray(A.answers[quiz.key]) ? [...A.answers[quiz.key]] : [];
      const at = list.indexOf(value);
      if (at >= 0) list.splice(at, 1);
      else if (list.length < 3) list.push(value);
      A.answers[quiz.key] = list;
    } else {
      A.answers[quiz.key] = value;
    }
    rerender();
  },
  quizNext() {
    if (A.quizStep >= QUIZ.length - 1) return go("goal");
    A.quizStep += 1;
    go("quiz");
  },
  quizSkip() {
    delete A.answers[QUIZ[A.quizStep].key];
    ACTIONS.quizNext();
  },
  quizBack() {
    if (A.quizStep === 0) return go("welcome");
    A.quizStep -= 1;
    go("quiz");
  },

  /* 3. Objectifs */
  pickCat(el) {
    A.draft.category = el.dataset.value;
    go("sub");
  },
  goalBack() {
    go("goal");
  },
  goalBack2() {
    go("goal");
  },
  pickSub(el) {
    return makeGoal(A.draft.category, el.dataset.value);
  },
  unsure() {
    return startGuide(null);
  },
  unsureFromCat() {
    return startGuide(A.draft.category);
  },
  newGoal() {
    A.result = null;
    A.edit = null;
    go("goal");
  },

  /* 4. « Je ne sais pas par où commencer » */
  async guideAnswer(el) {
    const qid = el.dataset.qid;
    const value = el.dataset.value;
    A.guide.log.push({ qid, value });
    A.guide.answers[qid] = value;
    if (qid === "help") A.ctx.help = value;
    if (qid === "domain") A.draft.category = value;
    await resolveGuideNext();
    afterGuide();
  },
  async guideFree() {
    const text = String(A.guide.free || "").trim();
    const cat = MentorEngine.detectCategory(text);
    const error = $("#guideError");
    if (!text || !cat) {
      if (error) error.textContent = T("guide.notUnderstood");
      return;
    }
    A.guide.log.push({ qid: "domain", value: cat, text });
    A.guide.answers.domain = cat;
    A.guide.free = "";
    A.draft.category = cat;
    await resolveGuideNext();
    afterGuide();
  },
  async guideBack() {
    const g = A.guide;
    const last = g.log.pop();
    if (!last) return go("goal");
    delete g.answers[last.qid];
    await resolveGuideNext();
    afterGuide();
  },
  async guideChange() {
    const g = A.guide;
    const last = g.log.pop();
    if (last) delete g.answers[last.qid];
    await resolveGuideNext();
    afterGuide();
  },
  guideConfirm() {
    const g = A.guide;
    return makeGoal(g.answers.domain, g.answers.goal);
  },

  /* 5. Plan personnalisé */
  addItem() {
    A.edit = { id: "new", title: "", task: "" };
    A._focus = "eTitle";
    renderApp();
  },
  editItem(el) {
    const item = planGoal()?.plan.find((entry) => entry.id === el.dataset.id);
    if (!item) return;
    A.edit = { id: item.id, title: loc(item.title), task: loc(item.task) };
    A._focus = "eTitle";
    renderApp();
  },
  cancelEdit() {
    A.edit = null;
    renderApp();
  },
  saveItem() {
    const goal = planGoal();
    const title = String(A.edit.title || "").trim();
    const task = String(A.edit.task || "").trim();
    if (!title) {
      $("#editError").textContent = T("plan.errTitle");
      $("#eTitle")?.focus();
      return;
    }
    if (A.edit.id === "new") {
      goal.plan.push({ id: uid("m"), title, task: task || title, duration: planCtx().time, points: 10, status: "todo", doneAt: null });
      if (goal.status === "done") goal.status = "active";
    } else {
      const item = goal.plan.find((entry) => entry.id === A.edit.id);
      if (item) {
        item.title = title;
        item.task = task || title;
      }
    }
    A.edit = null;
    rerender();
    toast(T("toast.planSaved"));
  },
  moveUp(el) {
    ACTIONS._move(el.dataset.id, -1);
  },
  moveDown(el) {
    ACTIONS._move(el.dataset.id, 1);
  },
  _move(id, delta) {
    const plan = planGoal().plan;
    const i = plan.findIndex((item) => item.id === id);
    const j = i + delta;
    if (i < 0 || j < 0 || j >= plan.length) return;
    [plan[i], plan[j]] = [plan[j], plan[i]];
    rerender();
  },
  delItem(el) {
    const goal = planGoal();
    goal.plan = goal.plan.filter((item) => item.id !== el.dataset.id);
    if (A.edit?.id === el.dataset.id) A.edit = null;
    rerender();
  },
  validatePlan() {
    const goal = draftGoal();
    if (!goal || !goal.plan.length) {
      $("#planError").textContent = T("plan.errEmpty");
      return;
    }
    goal.validated = true;
    goal.startDate = todayStr();
    goal.deadline = addDays(todayStr(), goal.plan.length - 1);
    A.activeGoalId = goal.id;
    A.draftGoalId = null;
    A.restDate = null;
    A.result = null;
    A.edit = null;
    go("today");
    toast(T("toast.planValidated"));
  },

  /* 6. Mission du jour */
  done() {
    completeMission();
  },
  async hard() {
    const goal = activeGoal();
    const item = currentItem(goal);
    if (!item) return;
    await MentorEngine.generateMission(item, true);
    A.easier = item.id;
    rerender();
    toast(loc(MentorEngine.getEncouragement(A.preferences.mentorStyle, "hard")));
  },
  full() {
    A.easier = null;
    rerender();
  },
  nextMission() {
    A.result = null;
    go("today");
  },
  tomorrow() {
    A.result = null;
    A.restDate = todayStr();
    go("today");
  },
  extra() {
    A.restDate = null;
    go("today");
  },

  /* Navigation par onglets */
  tab(el) {
    A.edit = null;
    A.confirmReset = false;
    if (el.dataset.value === "mentor") A._scrollChat = false;
    go(el.dataset.value);
  },

  /* Mentor (chat) */
  chip(el) {
    return ACTIONS._say(TL("mentor.chips")[Number(el.dataset.i)]);
  },
  send() {
    const input = $("#chatInput");
    const text = String(input?.value || "").trim();
    if (!text) return;
    return ACTIONS._say(text);
  },
  async _say(text) {
    const goal = activeGoal();
    const item = currentItem(goal);
    const reply = await MentorEngine.chatReply(text, {
      style: A.preferences.mentorStyle,
      mission: item ? { title: loc(item.title), minutes: A.easier === item.id ? 5 : item.duration } : null,
    });
    A.chat.push({ id: uid("c"), role: "me", text });
    A.chat.push({ id: uid("c"), role: "mentor", text: loc(reply) });
    A.chat = A.chat.slice(-40);
    A._focus = "chatInput";
    A._scrollChat = true;
    rerender();
  },
  mic() {
    toast(A.preferences.mic ? T("mentor.micSoon") : T("mentor.micOff"));
  },

  /* 7. Paramètres */
  style(el) {
    A.preferences.mentorStyle = el.dataset.value;
    rerender();
  },
  memDel(el) {
    memoryDelete(el.dataset.key);
    rerender();
    toast(T("toast.memDeleted"));
  },
  memAll() {
    A.answers = {};
    memoryDelete("age");
    A.chat = [];
    rerender();
    toast(T("toast.allDeleted"));
  },
  reset() {
    A.confirmReset = true;
    renderApp();
  },
  resetNo() {
    A.confirmReset = false;
    renderApp();
  },
  resetYes() {
    store.remove(APP_KEY);
    A = defaults();
    A.screen = "welcome";
    renderApp();
    window.scrollTo(0, 0);
    toast(T("toast.resetDone"));
  },
  exit() {
    location.hash = "";
  },
};

const CHANGES = {
  async lang(el) {
    await setLanguage(el.value);
  },
  notif(el) {
    A.preferences.notifications = el.checked;
    A.reminders.forEach((r) => {
      if (!el.checked) r.status = "off";
    });
    rerender();
  },
  rem(el) {
    const r = A.reminders.find((item) => item.id === el.dataset.id);
    if (r) r.status = el.checked ? "on" : "off";
    persist();
  },
  remTime(el) {
    const r = A.reminders.find((item) => item.id === el.dataset.id);
    if (r && el.value) r.time = el.value;
    persist();
  },
  mic(el) {
    A.preferences.mic = el.checked;
    persist();
  },
  memToggle(el) {
    A.preferences.memory = el.checked;
    rerender();
  },
  shareChanged() {
    rerender();
  },
};

/* ---------- Événements (un seul écouteur par type, sur #main) ---------- */
function bindAppEvents() {
  const main = $("#main");

  main.addEventListener("click", async (event) => {
    if (!appOpen) return;
    const el = event.target.closest("[data-action]");
    if (!el || !main.contains(el) || el.disabled) return;
    const action = ACTIONS[el.dataset.action];
    if (!action) return;
    if (el.dataset.focus) A._focus = el.dataset.focus;
    await action(el, event);
  });

  main.addEventListener("input", (event) => {
    if (!appOpen) return;
    const el = event.target.closest("[data-bind]");
    if (!el) return;
    setPath(A, el.dataset.bind, el.type === "checkbox" ? el.checked : el.value);
  });

  main.addEventListener("change", async (event) => {
    if (!appOpen) return;
    const bound = event.target.closest("[data-bind]");
    if (bound) persist();
    const el = event.target.closest("[data-change]");
    if (!el) return;
    if (el.dataset.focus) A._focus = el.dataset.focus;
    await CHANGES[el.dataset.change]?.(el);
  });

  main.addEventListener("keydown", async (event) => {
    if (!appOpen || event.key !== "Enter" || event.isComposing) return;
    const el = event.target.closest("[data-enter]");
    if (!el) return;
    event.preventDefault();
    await ACTIONS[el.dataset.enter]?.(el, event);
  });

  $(".brand")?.addEventListener("click", (event) => {
    if (!appOpen) return;
    event.preventDefault();
    location.hash = "";
  });

  window.addEventListener("hashchange", () => {
    if (wantApp() !== appOpen) {
      renderCurrent();
      window.scrollTo(0, 0);
    }
  });
}

document.addEventListener("DOMContentLoaded", bindAppEvents);
window.MentorAI = { engine: MentorEngine, getState: () => JSON.parse(JSON.stringify(A)) };
